<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <title>TAALBOUND — RUN THE RHYTHM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="TAALBOUND game"></canvas><audio id="music" preload="auto">
  <source src="audio/PULSE.mp3" type="audio/mpeg">
  </audio>
  <div id="hud">
    <div class="brand">TAALBOUND</div>
    <div class="progress"><div id="progressFill"></div></div>
    <div id="percent">0%</div>
    <div id="sectionName">INTRO</div>
  </div>
  <div id="startScreen" class="overlay">
    <div class="panel">
      <div class="title">TAALBOUND</div>
      <div class="tagline">RUN THE RHYTHM.</div>
      <button id="startButton">START</button>
      <div class="hint">Tap / Space to jump</div>
    </div>
  </div>
  <div id="deathScreen" class="overlay hidden">
    <div class="panel">
      <div id="resultTitle" class="title small">PULSE FAILED</div>
      <button id="restartButton">RESTART</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
